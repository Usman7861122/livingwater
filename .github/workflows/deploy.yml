name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # needed for AWS login without stored keys (OIDC)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  S3_BUCKET: living-water-website
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets can be cached for a year; pages must always be re-checked.
      - name: Upload assets
        run: aws s3 sync dist "s3://$S3_BUCKET" --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
      - name: Upload pages
        run: aws s3 sync dist "s3://$S3_BUCKET" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
