name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # needed for AWS login without stored keys (OIDC)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  S3_BUCKET: living-water-website
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Debug: show who GitHub says we are, to compare with the AWS role trust policy.
      # Prints only public claims (never the token itself).
      - name: Debug OIDC claims
        continue-on-error: true
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, environment}'
          echo "Role ARN variable: ${{ vars.AWS_ROLE_ARN }}"
          echo "Region variable:   ${{ vars.AWS_REGION }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets can be cached for a year; pages must always be re-checked.
      - name: Upload assets
        run: aws s3 sync dist "s3://$S3_BUCKET" --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
      - name: Upload pages
        run: aws s3 sync dist "s3://$S3_BUCKET" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
